[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinase-clustering"
version = "1.0.0"
description = "Layer Selection in Protein Language Models for Kinase Functional Classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ajit Kumar", email = "ajikumar@example.com"}
]
keywords = ["protein", "kinase", "ESM-2", "clustering", "machine-learning", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "requests==2.31.0",
    "pandas==2.1.4",
    "torch==2.1.2",
    "fair-esm==2.0.0",
    "numpy==1.26.3",
    "tqdm==4.66.1",
    "scikit-learn==1.4.0",
    "scipy==1.11.4",
    "statsmodels==0.14.1",
    "matplotlib==3.8.2",
    "seaborn==0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "ruff==0.1.9",
    "mypy==1.8.0",
]

[project.urls]
Homepage = "https://github.com/jhaaj08/Kinases-Clustering"
Repository = "https://github.com/jhaaj08/Kinases-Clustering"
Documentation = "https://github.com/jhaaj08/Kinases-Clustering/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "utils*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov=utils --cov-report=html --cov-report=term"

